<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva de Assentos - Ônibus</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Empresa de Ônibus XYZ</h1>
    </header>
    <div class="container">
        <h2>Selecione seu Assento</h2>
        <div id="bus">
            <div id="seats"></div>
        </div>
        <div id="reservation-form" style="display: none;">
            <h2>Reservar Assento</h2>
            <form id="form">
                <label for="name">Nome:</label>
                <input type="text" id="name" required>
                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" required maxlength="14" oninput="formatCPF(this)">
                <label for="phone">Telefone:</label>
                <input type="text" id="phone" required>
                <label for="email">Email:</label>
                <input type="email" id="email" required>
                <button type="submit">Reservar</button>
            </form>
        </div>
    </div>
    <footer>
        <p>&copy; 2024 Empresa de Ônibus XYZ. Todos os direitos reservados.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
